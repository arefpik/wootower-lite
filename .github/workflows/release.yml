name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard-app/package-lock.json

      - name: Build dashboard-app
        working-directory: dashboard-app
        run: |
          npm ci
          npm run build

      - name: Assemble plugin folder
        run: |
          mkdir -p build/wootower
          cp wootower.php readme.txt build/wootower/
          cp -r includes build/wootower/includes
          mkdir -p build/wootower/dashboard-app
          cp -r dashboard-app/build build/wootower/dashboard-app/build

      - name: Create ZIP
        working-directory: build
        run: zip -r ../wootower.zip wootower

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: wootower.zip
          generate_release_notes: true
